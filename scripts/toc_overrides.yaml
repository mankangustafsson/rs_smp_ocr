# TOC overrides for SMP volumes.
#
# Module names were derived from the "Testing and Repair of Modules" master
# TOCs that appear at the front of each Band (in content_list.json near the
# volume start) plus the "6.1.x A-designator" list at band-1 line ~10083.
#
# Structure per volume:
#   chapters:
#     - number: <int>
#       page_start: <int>          # 0-based page_idx in MinerU output
#       page_end:   <int | null>   # null means "to end of volume"
#       title_en:   <string>
#       title_de:   <string | null>
#       module:     <stock-or-designator>   # informational only

band-1:
  # Master TOC (Register list): Front Module VAR 02 / VAR 04 / VAR 06, plus
  # A8 Digital Synthesis. Band-1 also contains the two-language Chapter 6
  # overview of the entire SMP repair philosophy.
  chapters:
  - number: 1
    page_start: 22
    page_end: 85
    title_de: "Kap.6 Instandsetzung des SMP — Übersicht (DE)"
    title_en: "Ch.6 Repair of the SMP — Overview (German)"
  - number: 2
    page_start: 86
    page_end: 159
    title_de: "Kap.6 Instandsetzung des SMP — Übersicht (EN)"
    title_en: "Ch.6 Repair of the SMP — Overview (English)"
